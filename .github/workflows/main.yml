name: Android Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get build.gradle.kts versions
        id: gradle_versions
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Check existing releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")

          EXISTING_TAG=$(echo "$RESPONSE" | jq -r --arg tag "v${{ steps.gradle_versions.outputs.version_name }}" '.[] | .tag_name | select(. == $tag)')
          if [ -n "$EXISTING_TAG" ]; then
            echo "❌ Version ${{ steps.gradle_versions.outputs.version_name }} already exists in releases"
            exit 1
          fi

          EXISTING_CODE=$(echo "$RESPONSE" | jq -r --arg code "VersionCode: ${{ steps.gradle_versions.outputs.version_code }}" '.[] | select(.body | contains($code)) | .tag_name')
          if [ -n "$EXISTING_CODE" ]; then
            echo "❌ VersionCode ${{ steps.gradle_versions.outputs.version_code }} already exists in release: $EXISTING_CODE"
            exit 1
          fi

  build-and-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get build.gradle.kts versions
        id: gradle_versions
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Configure Gradle signing properties
        run: |
          echo "MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}" >> gradle.properties

      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/my-upload-key.keystore

      - name: Build APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease
          ls -lah app/build/outputs/apk/release/
          ls -lah app/build/outputs/bundle/release/

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.gradle_versions.outputs.version_name }}"
          mv app/build/outputs/apk/release/app-release.apk "artifacts/kuriamind-$VERSION.apk"
          mv app/build/outputs/bundle/release/app-release.aab "artifacts/kuriamind-aab-$VERSION.aab"
          ls -lah artifacts/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/kuriamind-aab-${{ steps.gradle_versions.outputs.version_name }}.aab
            artifacts/kuriamind-${{ steps.gradle_versions.outputs.version_name }}.apk
          tag_name: v${{ steps.gradle_versions.outputs.version_name }}
          name: Kuriamind v${{ steps.gradle_versions.outputs.version_name }}
          body: |
            Version: ${{ steps.gradle_versions.outputs.version_name }}
            VersionCode: ${{ steps.gradle_versions.outputs.version_code }}
          draft: false

      - name: Upload AAB to Google Play as draft
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kuriamind
          releaseFiles: artifacts/kuriamind-aab-${{ steps.gradle_versions.outputs.version_name }}.aab
          tracks: internal
          status: draft
